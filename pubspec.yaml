name: bill_due_reminder
description: "Bill and due-date reminders read from SMS, entirely on your phone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Scheduled reminder notifications (AlarmManager under the hood).
  flutter_local_notifications: ^22.3.3
  # Device time zone, so reminders fire at 9:00 local time.
  flutter_timezone: ^5.1.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: any
  path_provider: ^2.1.6
  sms_bill_parser:
    path: packages/sms_bill_parser
  timezone: ^0.11.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

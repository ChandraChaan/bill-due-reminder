name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - name: Install packages
        run: |
          flutter pub get
          (cd packages/sms_bill_parser && dart pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: |
          flutter analyze
          (cd packages/sms_bill_parser && dart analyze --fatal-infos)

      - name: Parser tests (SMS corpus)
        working-directory: packages/sms_bill_parser
        run: dart test

      - name: App tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
